<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("lumen.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", dark ? "dark" : "light");
          var lang = localStorage.getItem("lumen.lang");
          if (!lang) {
            lang = (navigator.language || "zh-CN").toLowerCase().startsWith("zh") ? "zh-CN" : "en";
          }
          root.lang = lang;
        } catch (e) {
          /* storage unavailable: keep defaults */
        }
      })();
    </script>
    <title>LUMEN 流明 · AI 影像工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307080a'/%3E%3Ccircle cx='16' cy='16' r='8' stroke='%23e7b778' fill='none'/%3E%3Ccircle cx='19.5' cy='12.5' r='2.2' fill='%23e7b778'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
